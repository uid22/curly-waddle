<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iayx Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/music-metadata-browser@2.5.10/dist/index.min.js"></script>
    <style>
        :root {
            --primary-color: #fff;
            --secondary-color: rgba(255, 255, 255, 0.9);
            --accent-color: #5865F2;
            --orange-color: #FF9500;
            --premium-color: #C71585;
            --background-color: #000;
            --glass-bg-start: rgba(0, 0, 0, 0.8);
            --glass-bg-end: rgba(20, 20, 20, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --glow-color: rgba(255, 255, 255, 0.5);
            --font-size-large: 3rem;
            --font-size-medium: 2rem;
            --font-size-small: 1rem;
            --spacing-large: 2rem;
            --spacing-medium: 1.25rem;
            --spacing-small: 0.75rem;
            --transition-fast: 0.3s ease;
            --transition-slow: 1s ease-in-out;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity var(--transition-slow);
            pointer-events: auto;
        }
        #intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }
        #intro-text {
            color: var(--primary-color);
            font-size: var(--font-size-large);
            font-weight: 700;
            letter-spacing: 0.125rem;
            text-transform: uppercase;
            filter: drop-shadow(0 0 0.625rem var(--glow-color));
            cursor: pointer;
            text-align: center;
            transition: transform var(--transition-fast);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #intro-text:hover {
            transform: scale(1.05);
        }

        
        .snowflake {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%);
        }

        body:not(.touch-device) {
            cursor: none;
        }
        body {
            background-color: var(--background-color);
            color: var(--primary-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity var(--transition-slow);
        }
        #background-video.visible {
            opacity: 1;
        }

        
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 2;
            opacity: 0;
            transition: opacity var(--transition-slow);
            pointer-events: none;
        }
        #video-overlay.visible {
            opacity: 1;
        }

        
        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-slow);
            pointer-events: auto;
            background: linear-gradient(135deg, rgba(0,0,0,0.45), rgba(12,12,12,0.45));
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.25rem;
            backdrop-filter: blur(0.9375rem);
            box-shadow: 0 0.25rem 2rem rgba(0,0,0,0.5);
            overflow: hidden;
        }
        #profile-block.visible {
            opacity: 1;
            visibility: visible;
        }

        
        #left-card {
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255,255,255,0.08);
            border-radius: 0;
            padding: 1.5rem 1.25rem;
            width: 13rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }
        .profile-container {
            display: none;
        }
        .discord-avatar-container {
            position: relative;
            width: 7rem;
            height: 7rem;
        }
        .discord-avatar {
            width: 7rem;
            height: 7rem;
            border-radius: 50%;
            object-fit: cover;
        }
        .discord-status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            border: 3px solid #111;
            box-sizing: border-box;
        }
        .discord-status-dot::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: var(--status-color, #747f8d);
            border-radius: 50%;
            transition: background 0.3s ease;
        }
        #left-card .discord-username {
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
        }
        #left-card .discord-custom-status {
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            text-align: center;
        }
        #left-card .discord-activity {
            color: rgba(255,255,255,0.75);
            font-size: 0.8rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }
        #left-card .discord-activity img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }
        .discord-offline {
            color: rgba(255,255,255,0.4);
            font-style: italic;
        }
        .location-label {
            color: rgba(255,255,255,0.45);
            font-size: 0.78rem;
            cursor: pointer;
            transition: var(--transition-fast);
            text-align: center;
        }
        .location-label:hover {
            color: var(--primary-color);
            text-shadow: 0 0 0.5rem var(--glow-color);
        }
        .left-divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        
        #right-side {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 22rem;
            background: transparent;
            border: none;
            padding: 1.5rem;
        }
        .name-with-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #profile-name {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.0625rem;
            color: var(--primary-color);
            filter: drop-shadow(0 0 0.5rem var(--glow-color));
            text-shadow: 0 0 0.3125rem rgba(255,255,255,0.4), 0 0 0.625rem rgba(255,255,255,0.2);
            position: relative;
            cursor: pointer;
            line-height: 1;
        }

        #profile-bio {
            color: var(--secondary-color);
            font-size: 1rem;
            line-height: 1.6;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid var(--primary-color);
            width: fit-content;
            min-height: 1.6em;
            display: block;
        }

        .bio-separator { display: none; }
        .profile-footer { display: contents; }

        .social-links {
            display: flex;
            justify-content: flex-start;
            gap: 0.75rem;
            pointer-events: auto;
        }
        .social-button {
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 0.9rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            transition: all var(--transition-fast);
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        .social-button img {
            width: 2.2rem;
            height: 2.2rem;
            transition: transform var(--transition-fast);
        }
        .social-button:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
            border-color: rgba(255,255,255,0.3);
        }
        .social-button:hover img { transform: scale(1.1); }

        
        .discord-container { display: none; }
        
        .notification {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            font-size: var(--font-size-small);
            z-index: 30;
            backdrop-filter: blur(0.625rem);
            opacity: 0;
            transform: translateY(1.25rem);
            transition: opacity var(--transition-fast), transform var(--transition-fast);
        }
        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .volume-control {
            position: fixed;
            top: var(--spacing-medium);
            right: var(--spacing-medium);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 1.2s ease-out;
            pointer-events: none;
        }
        .volume-control.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .volume-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(0.625rem);
            transition: all var(--transition-fast);
        }
        .volume-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .volume-btn img {
            width: 1.5rem;
            height: 1.5rem;
        }
        .volume-slider-container {
            width: 0;
            overflow: hidden;
            transition: width var(--transition-fast), opacity var(--transition-fast);
            opacity: 0;
        }
        .volume-slider-container.visible {
            width: 9.375rem;
            opacity: 1;
        }
        #volume-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 0.5rem;
            border-radius: 0.25rem;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 0.625rem rgba(88, 101, 242, 0.5);
        }

        
        .discord-container {
            width: 100%;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .discord-status {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }
        .discord-avatar-container {
            position: relative;
            width: 84px;
            height: 84px;
        }
        .discord-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
        }
        .discord-status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 26px;
            height: 26px;
            background: #fff;
            border-radius: 50%;
            border: 4px solid #000;
            box-sizing: border-box;
        }
        .discord-status-dot::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--status-color, #747f8d);
            border-radius: 50%;
            transition: background 0.3s ease;
        }
        .discord-info {
            flex: 1;
        }
        .discord-username {
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .discord-custom-status {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-top: 0.25rem;
        }
        .discord-activity {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .discord-activity img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
        }
        .discord-offline {
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        #weather-tab {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20rem;
            background: linear-gradient(135deg, rgba(0,0,0,0.88), rgba(10,10,10,0.88));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.25rem;
            z-index: 25;
            backdrop-filter: blur(1.2rem);
            box-shadow: 0 0 3rem rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-slow);
            color: var(--primary-color);
            overflow: hidden;
        }
        #weather-tab.visible {
            opacity: 1;
            visibility: visible;
        }
        #weather-hero {
            padding: 1.4rem 1.4rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        #current-weather {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.01em;
        }
        #current-desc {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.25rem;
        }
        .weekly-forecast {
            display: flex;
            flex-direction: column;
        }
        .day-forecast {
            display: grid;
            grid-template-columns: 3rem 1.6rem 1fr auto;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 1.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .day-forecast:last-child { border-bottom: none; }
        .day-name {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.65);
        }
        .day-icon { font-size: 1rem; }
        .day-desc {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .day-temps {
            font-size: 0.82rem;
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
        }
        .day-low { color: rgba(255,255,255,0.3); }
        .day-high { color: white; font-weight: 600; }
        #weather-footer {
            padding: 0.75rem 1.4rem;
            border-top: 1px solid rgba(255,255,255,0.07);
        }
        .back-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            padding: 0;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .back-btn:hover { color: white; }

        
        #crypto-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #crypto-modal.active {
            display: flex;
        }
        .crypto-modal-box {
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(20,20,20,0.95));
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.25rem;
            padding: 2rem;
            width: 92%;
            max-width: 500px;
            position: relative;
            animation: cryptoPop 0.35s ease-out;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
        }
        @keyframes cryptoPop {
            from { transform: scale(0.88); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .crypto-modal-close {
            position: absolute;
            top: 1rem; right: 1.2rem;
            font-size: 1.6rem;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            background: none;
            border: none;
            line-height: 1;
        }
        .crypto-modal-close:hover { color: #fff; transform: rotate(90deg); }
        .crypto-modal-name {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.25rem;
        }
        .crypto-modal-price {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 700;
            margin: 0.4rem 0 0.2rem;
        }
        .crypto-modal-change {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 1.2rem;
            opacity: 0.85;
        }
        .crypto-modal-chart {
            height: 200px;
            margin-bottom: 1.4rem;
        }
        .crypto-modal-addr-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.45);
            margin-bottom: 0.4rem;
        }
        .crypto-modal-addr {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.7rem;
            padding: 0.8rem 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            color: rgba(255,255,255,0.85);
            margin-bottom: 0.8rem;
        }
        .crypto-modal-copy {
            display: block;
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 0.7rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: filter 0.2s, transform 0.2s;
            color: #fff;
        }
        .crypto-modal-copy:hover { filter: brightness(1.15); transform: translateY(-1px); }

        @media (max-width: 430px) {
            #profile-block {
                width: 95%;
            }
            .profile-container {
                width: 7.5rem;
                height: 7.5rem;
            }
            .location-label {
                font-size: 0.9rem;
                bottom: 0.1rem;
                right: 1rem;
            }
            #current-weather {
                font-size: 2.5rem;
            }
            .day-forecast {
                font-size: 1rem;
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="intro-screen">
        <div id="intro-text">Click to Enter</div>
    </div>

    <video id="background-video" autoplay loop muted playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>
    <audio id="background-audio" loop preload="auto">
        <source src="Audio.mp3" type="audio/mpeg">
    </audio>

    <div id="profile-block">

        
        <div id="left-card">
            <div class="discord-avatar-container">
                <img id="discord-avatar" src="" alt="Discord Avatar" class="discord-avatar">
                <div class="discord-status-dot" id="status-dot"></div>
            </div>
            <div class="left-divider"></div>
            <div id="discord-username" class="discord-username">Loading...</div>
            <div id="discord-custom" class="discord-custom-status"></div>
            <div id="discord-activity" class="discord-activity"></div>
<div class="left-divider"></div>
            <div class="location-label" id="location-label">𖡡 Washington State</div>
            <div id="pst-clock" style="color:rgba(255,255,255,0.5);font-size:0.82rem;text-align:center;letter-spacing:0.03em;font-variant-numeric:tabular-nums;"></div>
        </div>

        
        <div id="right-side">
            <div>
                <div class="name-with-badge">
                    <div id="profile-name">Iayx</div>
                </div>
                <div id="profile-bio"></div>
            </div>

            
            <div style="padding:0.8rem 1rem; background:rgba(255,255,255,0.05); border-radius:1rem; border:1px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:space-between; gap:0.8rem;">
                <div style="display:flex; align-items:center; gap:0.8rem; min-width:0; flex:1;">
                    <img src="ServerLogo.png" alt="Oblivion Server" style="width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,0.15); flex-shrink:0;">
                    <div style="color:white; font-size:1.05rem; font-weight:600; font-family:'Rubik', sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Oblivion</div>
                </div>
                <a href="https://discord.gg/MxmB8jfRtZ" target="_blank" style="display:inline-block; background:#43b581; color:white; font-weight:600; padding:0.5rem 1.2rem; border-radius:9999px; text-decoration:none; font-size:0.9rem; white-space:nowrap; flex-shrink:0; box-shadow:0 2px 8px rgba(67,181,129,0.3);">Join</a>
            </div>

            
            <div class="social-links">
                <button onclick="openCryptoModal('Bitcoin','bitcoin','bc1q7urjtd2naxmajcvylmmz5clqyc3mfmvauw9kmt','#F7931A')" class="social-button">
                    <img src="bitcoin (1).png" alt="Bitcoin">
                </button>
                <button onclick="openCryptoModal('Ethereum','ethereum','0xdaB1b433BD3AeB1ADbAA5724B9cC05EAf047be46','#627EEA')" class="social-button">
                    <img src="ethereum (3).png" alt="Ethereum">
                </button>
                <button onclick="openCryptoModal('Solana','solana','9QNvBo7uwd3AfwxM7Dfc3Ufm4ML6TG2gtHH7GSnNjnih','#9945FF')" class="social-button">

    <script>
        
        const introScreen = document.getElementById('intro-screen');
        const profileBlock = document.getElementById('profile-block');
        const backgroundVideo = document.getElementById('background-video');
        const audio = document.getElementById('background-audio');
        const notification = document.getElementById('notification');
        const volumeControl = document.getElementById('volume-control');

        let hasEntered = false;

        document.addEventListener('click', () => {
            if (hasEntered) return;
            hasEntered = true;

            introScreen.classList.add('hidden');

            backgroundVideo.classList.add('visible');
            audio.muted = false;
            audio.volume = 1.0;
            audio.play().catch((error) => {
                console.error('Audio playback failed:', error);
                notification.textContent = 'Click again to enable audio';
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 3000);
            });

            loadMetadata();

            
            setTimeout(() => {
                profileBlock.classList.add('visible');
                volumeControl.classList.add('visible');
            }, 3300);
        }, { once: true });

        
        function makeTypewriter(elementId, phrases, typeSpeed, deleteSpeed, pauseAfterType, pauseAfterDelete) {
            const el = document.getElementById(elementId);
            let phraseIdx = 0, charIdx = 0, deleting = false;
            function tick() {
                const full = phrases[phraseIdx];
                if (!deleting) {
                    charIdx++;
                    el.textContent = full.substring(0, charIdx);
                    if (charIdx >= full.length) {
                        deleting = true;
                        setTimeout(tick, pauseAfterType);
                        return;
                    }
                } else {
                    charIdx--;
                    el.textContent = full.substring(0, charIdx);
                    if (charIdx <= 0) {
                        deleting = false;
                        phraseIdx = (phraseIdx + 1) % phrases.length;
                        setTimeout(tick, pauseAfterDelete);
                        return;
                    }
                }
                setTimeout(tick, deleting ? deleteSpeed : typeSpeed);
            }
            tick();
        }

        makeTypewriter('profile-bio', ['locked in', 'I love gambling', 'passion project'], 80, 40, 1500, 400);

        
        const snowflakes = [];
        const maxSnowflakes = 30;

        document.addEventListener('mousemove', (e) => {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.style.left = e.clientX + 'px';
            snowflake.style.top = e.clientY + 'px';

            const size = Math.random() * 4 + 4;
            snowflake.style.width = size + 'px';
            snowflake.style.height = size + 'px';

            snowflake.drift = Math.random() * 2 - 1;
            snowflake.velocityY = Math.random() * 1 + 1;
            snowflake.life = 100;

            document.body.appendChild(snowflake);
            snowflakes.push(snowflake);

            if (snowflakes.length > maxSnowflakes) {
                const old = snowflakes.shift();
                if (old && old.parentNode) old.remove();
            }
        });

        function animateSnow() {
            snowflakes.forEach((flake, index) => {
                if (!flake.parentNode) {
                    snowflakes.splice(index, 1);
                    return;
                }

                flake.life--;

                let top = parseFloat(flake.style.top);
                let left = parseFloat(flake.style.left);

                top += flake.velocityY;
                left += flake.drift;

                flake.style.top = top + 'px';
                flake.style.left = left + 'px';
                flake.style.opacity = flake.life / 100;

                if (flake.life <= 0) {
                    flake.remove();
                    snowflakes.splice(index, 1);
                }
            });

            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const snowflake = document.createElement('div');
                    snowflake.className = 'snowflake';
                    snowflake.style.left = e.clientX + (Math.random() * 40 - 20) + 'px';
                    snowflake.style.top = e.clientY + (Math.random() * 40 - 20) + 'px';

                    const size = Math.random() * 5 + 3;
                    snowflake.style.width = size + 'px';
                    snowflake.style.height = size + 'px';

                    snowflake.drift = Math.random() * 4 - 2;
                    snowflake.velocityY = Math.random() * 2 + 1;
                    snowflake.life = 80 + Math.random() * 40;

                    document.body.appendChild(snowflake);
                    snowflakes.push(snowflake);
                }, i * 50);
            }
        });

        
        function copyToClipboard(value, type) {
            navigator.clipboard.writeText(value).then(() => {
                notification.textContent = `Copied ${type} address`;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 3000);
            }).catch(() => {
                notification.textContent = 'Failed to copy address';
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 3000);
            });
        }

        
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSliderContainer = document.getElementById('volume-slider-container');
        const volumeSlider = document.getElementById('volume-slider');
        audio.volume = 1.0;
        volumeSlider.value = 1.0;
        volumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            volumeSliderContainer.classList.toggle('visible');
        });
        document.addEventListener('click', () => {
            if (volumeSliderContainer.classList.contains('visible')) {
                volumeSliderContainer.classList.remove('visible');
            }
        });
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = parseFloat(e.target.value);
        });

        
        async function loadMetadata() {
            try {
                const { parseBlob } = musicMetadata;
                const response = await fetch('Audio.mp3');
                if (!response.ok) throw new Error('Failed to fetch');
                const blob = await response.blob();
                const metadata = await parseBlob(blob);
                const title = metadata.common.title || 'Snares (Judo)';
                console.log('Song title:', title); 
            } catch (err) {
                console.error('Metadata error:', err);
            }
        }

        
        const style = document.createElement('style');
        style.innerHTML = `.discord-status-dot::after { background: var(--status-color, #747f8d); }`;
        document.head.appendChild(style);

        
        const DISCORD_ID = '1123405235398901912';

        const discordAvatar = document.getElementById('discord-avatar');
        const discordUsername = document.getElementById('discord-username');
        const discordCustom = document.getElementById('discord-custom');
        const discordActivity = document.getElementById('discord-activity');
        const statusDot = document.getElementById('status-dot');

        function updateDiscordStatus(data) {
            if (!data || !data.discord_user) {
                discordUsername.textContent = 'Discord offline or unavailable';
                discordUsername.classList.add('discord-offline');
                discordAvatar.src = '';
                statusDot.style.display = 'none';
                return;
            }

            const user = data.discord_user;
            discordAvatar.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`;
            discordUsername.textContent = user.global_name || user.username;
            discordUsername.classList.remove('discord-offline');
            statusDot.style.display = 'block';

            const status = data.discord_status;
            let dotColor = '#747f8d';
            if (status === 'online') dotColor = '#43b581';
            else if (status === 'idle') dotColor = '#faa61a';
            else if (status === 'dnd') dotColor = '#f04747';
            statusDot.style.setProperty('--status-color', dotColor);

            discordCustom.innerHTML = '';
            if (data.activities) {
                const custom = data.activities.find(a => a.type === 4);
                if (custom && custom.state) {
                    let text = custom.state;
                    if (custom.emoji && custom.emoji.id) {
                        text = `<img src="https://cdn.discordapp.com/emojis/${custom.emoji.id}.png" style="width:20px;height:20px;vertical-align:middle;margin-right:4px;">${text}`;
                    } else if (custom.emoji) {
                        text = `${custom.emoji.name} ${text}`;
                    }
                    discordCustom.innerHTML = text;
                }
            }

            discordActivity.innerHTML = '';
            const activity = data.activities?.find(a => a.type === 0 || (a.name === 'Spotify' && data.listening_to_spotify));
            if (activity) {
                let text = '';
                let img = '';

                if (data.listening_to_spotify && activity.name === 'Spotify') {
                    text = `Listening to ${activity.details} by ${activity.state}`;
                    if (activity.assets?.large_image) {
                        img = `https://i.scdn.co/image/${activity.assets.large_image.split('spotify:')[1]}`;
                    }
                } else {
                    text = `Playing ${activity.name}`;
                    if (activity.details) text += `: ${activity.details}`;
                    if (activity.assets?.large_image && activity.application_id) {
                        img = `https://media.discordapp.net/app-assets/${activity.application_id}/${activity.assets.large_image}.png`;
                    }
                }

                if (img) discordActivity.innerHTML += `<img src="${img}" alt="Activity">`;
                discordActivity.innerHTML += `<span>${text}</span>`;
            }
        }

        const ws = new WebSocket('wss://api.lanyard.rest/socket');
        ws.onopen = () => {
            ws.send(JSON.stringify({
                op: 2,
                d: { subscribe_to_id: DISCORD_ID }
            }));
            setInterval(() => ws.send(JSON.stringify({ op: 3 })), 30000);
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE') {
                updateDiscordStatus(msg.d);
            }
        };

        fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
            .then(res => res.json())
            .then(json => updateDiscordStatus(json.data))
            .catch(() => {
                discordUsername.textContent = 'Failed to load Discord status';
            });

        
        const locationLabel = document.getElementById('location-label');
        const weatherTab = document.getElementById('weather-tab');
        const currentWeather = document.getElementById('current-weather');
        const currentDesc = document.getElementById('current-desc');
        const weeklyForecast = document.getElementById('weekly-forecast');
        const backBtn = document.getElementById('back-btn');

        const weatherIcons = {
            0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
            45: '🌫️', 48: '🌫️',
            51: '🌦️', 61: '🌧️', 80: '🌧️',
            95: '⛈️'
        };

        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        locationLabel.addEventListener('click', async () => {
            profileBlock.style.opacity = '0';
            weatherTab.classList.add('visible');
            currentWeather.textContent = '...';
            currentDesc.textContent = '';
            weeklyForecast.innerHTML = '';
            try {
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=47.6062&longitude=-122.3321&daily=temperature_2m_max,temperature_2m_min,weather_code&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=7';
                const res = await fetch(url);
                const data = await res.json();
                const currentTempF = Math.round(data.current.temperature_2m);
                const currentCode = data.current.weather_code;
                const currentIcon = weatherIcons[currentCode] || '🌡️';
                const descMap = {0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Icy fog',51:'Light drizzle',61:'Rain',80:'Showers',95:'Thunderstorm'};
                currentWeather.textContent = `${currentIcon} ${currentTempF}°F`;
                currentDesc.textContent = descMap[currentCode] || '';
                const dates = data.daily.time;
                const highs = data.daily.temperature_2m_max;
                const lows = data.daily.temperature_2m_min;
                const codes = data.daily.weather_code;
                dates.forEach((dateStr, i) => {
                    const date = new Date(dateStr);
                    const dayName = i === 0 ? 'Today' : dayNames[date.getDay()];
                    const high = Math.round(highs[i]);
                    const low = Math.round(lows[i]);
                    const icon = weatherIcons[codes[i]] || '🌤️';
                    const dayEl = document.createElement('div');
                    dayEl.className = 'day-forecast';
                    const descMap2 = {0:'Clear',1:'Clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',61:'Rain',80:'Showers',95:'Thunder'};
                    const shortDesc = descMap2[codes[i]] || '';
                    dayEl.innerHTML = `<span class="day-name">${dayName}</span><span class="day-icon">${icon}</span><span class="day-desc">${shortDesc}</span><span class="day-temps"><span class="day-low">${low}°</span><span class="day-high">${high}°</span></span>`;
                    weeklyForecast.appendChild(dayEl);
                });
            } catch (err) {
                currentWeather.textContent = 'Failed';
            }
        });

        backBtn.addEventListener('click', () => {
            weatherTab.classList.remove('visible');
            profileBlock.style.opacity = '1';
        });

        
        if ('ontouchstart' in window) {
            document.body.classList.add('touch-device');
        }

        
        function updateClock() {
            const now = new Date();
            const pst = new Date(now.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
            let h = pst.getHours();
            const m = String(pst.getMinutes()).padStart(2, '0');
            const s = String(pst.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('pst-clock').textContent = `${h}:${m}:${s} ${ampm}`;
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
    
    <div id="crypto-modal">
        <div class="crypto-modal-box">
            <button class="crypto-modal-close" onclick="closeCryptoModal()">×</button>
            <div class="crypto-modal-name" id="cm-name"></div>
            <div class="crypto-modal-price" id="cm-price">Loading...</div>
            <div class="crypto-modal-change" id="cm-change"></div>
            <div class="crypto-modal-chart">
                <canvas id="cm-chart"></canvas>
            </div>
            <div class="crypto-modal-addr-label">Your Address</div>
            <div class="crypto-modal-addr" id="cm-addr"></div>
            <button class="crypto-modal-copy" id="cm-copy-btn">Copy Address</button>
        </div>
    </div>

    <script>
        
        let cmChart = null;

        function openCryptoModal(name, id, address, color) {
            document.getElementById('cm-name').textContent = name;
            document.getElementById('cm-price').textContent = 'Loading...';
            document.getElementById('cm-price').style.color = color;
            document.getElementById('cm-change').textContent = '';
            document.getElementById('cm-addr').textContent = address;

            const copyBtn = document.getElementById('cm-copy-btn');
            copyBtn.style.background = color;
            copyBtn.textContent = 'Copy Address';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(address).then(() => {
                    copyBtn.textContent = '✓ Copied!';
                    setTimeout(() => copyBtn.textContent = 'Copy Address', 2000);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = address;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    copyBtn.textContent = '✓ Copied!';
                    setTimeout(() => copyBtn.textContent = 'Copy Address', 2000);
                });
            };

            if (cmChart) { cmChart.destroy(); cmChart = null; }
            document.getElementById('crypto-modal').classList.add('active');

            
            const krakenPairs = { bitcoin: 'XBTUSD', litecoin: 'LTCUSD', ethereum: 'ETHUSD', solana: 'SOLUSD' };

            async function fetchPrice() {
                
                try {
                    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd&include_24hr_change=true`);
                    if (!r.ok) throw new Error('rate limited');
                    const data = await r.json();
                    const price = data[id]?.usd;
                    const change = data[id]?.usd_24h_change;
                    if (!price) throw new Error('no price');
                    document.getElementById('cm-price').textContent = '$' + price.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    if (change !== undefined) {
                        const el = document.getElementById('cm-change');
                        el.textContent = (change >= 0 ? '▲ ' : '▼ ') + Math.abs(change).toFixed(2) + '% (24h)';
                        el.style.color = change >= 0 ? '#4cff91' : '#ff5e5e';
                    }
                    return;
                } catch(_) {}
                
                try {
                    const pair = krakenPairs[id];
                    const r = await fetch(`https://api.kraken.com/0/public/Ticker?pair=${pair}`);
                    if (!r.ok) throw new Error('kraken error');
                    const data = await r.json();
                    const result = data.result[Object.keys(data.result)[0]];
                    const price = parseFloat(result.c[0]);
                    const open = parseFloat(result.o);
                    const change = ((price - open) / open) * 100;
                    document.getElementById('cm-price').textContent = '$' + price.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    const el = document.getElementById('cm-change');
                    el.textContent = (change >= 0 ? '▲ ' : '▼ ') + Math.abs(change).toFixed(2) + '% (24h)';
                    el.style.color = change >= 0 ? '#4cff91' : '#ff5e5e';
                } catch(_) {
                    document.getElementById('cm-price').textContent = 'Unavailable';
                }
            }
            fetchPrice();

            
            const krakenOHLC = { bitcoin: 'XBTUSD', litecoin: 'LTCUSD', ethereum: 'ETHUSD', solana: 'SOLUSD' };

            async function fetchChart() {
                let labels = [], prices = [];

                
                try {
                    const r = await fetch(`https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=7`);
                    if (!r.ok) throw new Error('rate limited');
                    const data = await r.json();
                    if (!data.prices?.length) throw new Error('no data');
                    labels = data.prices.map(p => new Date(p[0]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
                    prices = data.prices.map(p => p[1]);
                } catch(_) {
                    
                    try {
                        const pair = krakenOHLC[id];
                        const since = Math.floor(Date.now() / 1000) - 7 * 24 * 3600;
                        const r = await fetch(`https://api.kraken.com/0/public/OHLC?pair=${pair}&interval=1440&since=${since}`);
                        if (!r.ok) throw new Error('kraken chart error');
                        const data = await r.json();
                        const candles = data.result[Object.keys(data.result)[0]];
                        labels = candles.map(c => new Date(c[0] * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
                        prices = candles.map(c => parseFloat(c[4])); 
                    } catch(_) { return; }
                }

                const hex = color.replace('#','');
                const rv = parseInt(hex.slice(0,2),16);
                const gv = parseInt(hex.slice(2,4),16);
                const bv = parseInt(hex.slice(4,6),16);

                const ctx = document.getElementById('cm-chart').getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, 0, 200);
                grad.addColorStop(0, `rgba(${rv},${gv},${bv},0.4)`);
                grad.addColorStop(1, `rgba(${rv},${gv},${bv},0.02)`);

                cmChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            data: prices,
                            borderColor: color,
                            backgroundColor: grad,
                            borderWidth: 2.5,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            pointHoverBackgroundColor: color
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(0,0,0,0.8)',
                                titleColor: color,
                                bodyColor: '#fff',
                                padding: 8,
                                callbacks: {
                                    label: ctx => '$' + ctx.parsed.y.toLocaleString('en-US', { minimumFractionDigits: 2 })
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { color: 'rgba(255,255,255,0.45)', maxTicksLimit: 7 }
                            },
                            y: {
                                grid: { color: 'rgba(255,255,255,0.06)' },
                                ticks: {
                                    color: 'rgba(255,255,255,0.55)',
                                    callback: v => '$' + (v >= 1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(0))
                                }
                            }
                        }
                    }
                });
            }
            fetchChart();
        }

        function closeCryptoModal() {
            document.getElementById('crypto-modal').classList.remove('active');
            if (cmChart) { cmChart.destroy(); cmChart = null; }
        }

        document.getElementById('crypto-modal').addEventListener('click', e => {
            if (e.target.id === 'crypto-modal') closeCryptoModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeCryptoModal();
        });
    </script>
