<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Iayx Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/music-metadata-browser@2.5.10/dist/index.min.js"></script>
    <style>
        :root {
            --primary-color: #fff;
            --secondary-color: rgba(255, 255, 255, 0.9);
            --accent-color: #5865F2;
            --orange-color: #FF9500;
            --premium-color: #C71585;
            --background-color: #000;
            --glass-bg-start: rgba(0, 0, 0, 0.8);
            --glass-bg-end: rgba(20, 20, 20, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --glow-color: rgba(255, 255, 255, 0.5);
            --font-size-large: 3rem;
            --font-size-medium: 2rem;
            --font-size-small: 1rem;
            --spacing-large: 2rem;
            --spacing-medium: 1.25rem;
            --spacing-small: 0.75rem;
            --transition-fast: 0.3s ease;
            --transition-slow: 1s ease-in-out;
        }

        html {
            color-scheme: dark;
        }

        body {
            background-color: var(--background-color);
            color: var(--primary-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            image-rendering: crisp-edges;           /* helps with pixel art / sharp png edges */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        img {
            image-rendering: -webkit-optimize-contrast; /* Chrome/Edge */
            image-rendering: crisp-edges;               /* Firefox */
            max-width: 100%;
        }

        .social-button img {
            filter: brightness(1) contrast(1) saturate(1.05); /* slight boost to prevent dullness */
            width: 2.2rem;
            height: 2.2rem;
            transition: transform var(--transition-fast);
        }

        /* Rest of your original styles remain unchanged below */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity var(--transition-slow);
            pointer-events: auto;
        }
        #intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }
        #intro-text {
            color: var(--primary-color);
            font-size: var(--font-size-large);
            font-weight: 700;
            letter-spacing: 0.125rem;
            text-transform: uppercase;
            filter: drop-shadow(0 0 0.625rem var(--glow-color));
            cursor: pointer;
            text-align: center;
            transition: transform var(--transition-fast);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #intro-text:hover {
            transform: scale(1.05);
        }

        
        .snowflake {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%);
        }

        body:not(.touch-device) {
            cursor: none;
        }
        
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity var(--transition-slow);
        }
        #background-video.visible {
            opacity: 1;
        }

        
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 2;
            opacity: 0;
            transition: opacity var(--transition-slow);
            pointer-events: none;
        }
        #video-overlay.visible {
            opacity: 1;
        }

        
        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-slow);
            pointer-events: auto;
            background: linear-gradient(135deg, rgba(0,0,0,0.45), rgba(12,12,12,0.45));
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.25rem;
            backdrop-filter: blur(0.9375rem);
            box-shadow: 0 0.25rem 2rem rgba(0,0,0,0.5);
            overflow: hidden;
        }
        #profile-block.visible {
            opacity: 1;
            visibility: visible;
        }

        
        #left-card {
            background: transparent;
            border: none;
            border-right: 1px solid rgba(255,255,255,0.08);
            border-radius: 0;
            padding: 1.5rem 1.25rem;
            width: 13rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }
        .profile-container {
            display: none;
        }
        .discord-avatar-container {
            position: relative;
            width: 7rem;
            height: 7rem;
        }
        .discord-avatar {
            width: 7rem;
            height: 7rem;
            border-radius: 50%;
            object-fit: cover;
        }
        .discord-status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            border: 3px solid #111;
            box-sizing: border-box;
        }
        .discord-status-dot::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: var(--status-color, #747f8d);
            border-radius: 50%;
            transition: background 0.3s ease;
        }
        #left-card .discord-username {
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
        }
        #left-card .discord-custom-status {
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            text-align: center;
        }
        #left-card .discord-activity {
            color: rgba(255,255,255,0.75);
            font-size: 0.8rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }
        #left-card .discord-activity img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }
        .discord-offline {
            color: rgba(255,255,255,0.4);
            font-style: italic;
        }
        .location-label {
            color: rgba(255,255,255,0.45);
            font-size: 0.78rem;
            cursor: pointer;
            transition: var(--transition-fast);
            text-align: center;
        }
        .location-label:hover {
            color: var(--primary-color);
            text-shadow: 0 0 0.5rem var(--glow-color);
        }
        .left-divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        
        #right-side {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 22rem;
            background: transparent;
            border: none;
            padding: 1.5rem;
        }
        .name-with-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #profile-name {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.0625rem;
            color: var(--primary-color);
            filter: drop-shadow(0 0 0.5rem var(--glow-color));
            text-shadow: 0 0 0.3125rem rgba(255,255,255,0.4), 0 0 0.625rem rgba(255,255,255,0.2);
            position: relative;
            cursor: pointer;
            line-height: 1;
        }

        #profile-bio {
            color: var(--secondary-color);
            font-size: 1rem;
            line-height: 1.6;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid var(--primary-color);
            width: fit-content;
            min-height: 1.6em;
            display: block;
        }

        .bio-separator { display: none; }
        .profile-footer { display: contents; }

        .social-links {
            display: flex;
            justify-content: flex-start;
            gap: 0.75rem;
            pointer-events: auto;
        }
        .social-button {
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 0.9rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
            transition: all var(--transition-fast);
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        .social-button:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
            border-color: rgba(255,255,255,0.3);
        }
        .social-button:hover img { transform: scale(1.1); }

        
        .discord-container { display: none; }
        
        .notification {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            font-size: var(--font-size-small);
            z-index: 30;
            backdrop-filter: blur(0.625rem);
            opacity: 0;
            transform: translateY(1.25rem);
            transition: opacity var(--transition-fast), transform var(--transition-fast);
        }
        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .volume-control {
            position: fixed;
            top: var(--spacing-medium);
            right: var(--spacing-medium);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 1.2s ease-out;
            pointer-events: none;
        }
        .volume-control.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .volume-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(0.625rem);
            transition: all var(--transition-fast);
        }
        .volume-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        .volume-btn img {
            width: 1.5rem;
            height: 1.5rem;
        }
        .volume-slider-container {
            width: 0;
            overflow: hidden;
            transition: width var(--transition-fast), opacity var(--transition-fast);
            opacity: 0;
        }
        .volume-slider-container.visible {
            width: 9.375rem;
            opacity: 1;
        }
        #volume-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 0.5rem;
            border-radius: 0.25rem;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 0.625rem rgba(88, 101, 242, 0.5);
        }

        
        .discord-container {
            width: 100%;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .discord-status {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }
        .discord-avatar-container {
            position: relative;
            width: 84px;
            height: 84px;
        }
        .discord-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
        }
        .discord-status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 26px;
            height: 26px;
            background: #fff;
            border-radius: 50%;
            border: 4px solid #000;
            box-sizing: border-box;
        }
        .discord-status-dot::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--status-color, #747f8d);
            border-radius: 50%;
            transition: background 0.3s ease;
        }
        .discord-info {
            flex: 1;
        }
        .discord-username {
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .discord-custom-status {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-top: 0.25rem;
        }
        .discord-activity {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .discord-activity img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
        }
        .discord-offline {
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        #weather-tab {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20rem;
            background: linear-gradient(135deg, rgba(0,0,0,0.88), rgba(10,10,10,0.88));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.25rem;
            z-index: 25;
            backdrop-filter: blur(1.2rem);
            box-shadow: 0 0 3rem rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-slow);
            color: var(--primary-color);
            overflow: hidden;
        }
        #weather-tab.visible {
            opacity: 1;
            visibility: visible;
        }
        #weather-hero {
            padding: 1.4rem 1.4rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        #current-weather {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.01em;
        }
        #current-desc {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.25rem;
        }
        .weekly-forecast {
            display: flex;
            flex-direction: column;
        }
        .day-forecast {
            display: grid;
            grid-template-columns: 3rem 1.6rem 1fr auto;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 1.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .day-forecast:last-child { border-bottom: none; }
        .day-name {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.65);
        }
        .day-icon { font-size: 1rem; }
        .day-desc {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .day-temps {
            font-size: 0.82rem;
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
        }
        .day-low { color: rgba(255,255,255,0.3); }
        .day-high { color: white; font-weight: 600; }
        #weather-footer {
            padding: 0.75rem 1.4rem;
            border-top: 1px solid rgba(255,255,255,0.07);
        }
        .back-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            padding: 0;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .back-btn:hover { color: white; }

        
        #crypto-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #crypto-modal.active {
            display: flex;
        }
        .crypto-modal-box {
            background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(20,20,20,0.95));
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.25rem;
            padding: 2rem;
            width: 92%;
            max-width: 500px;
            position: relative;
            animation: cryptoPop 0.35s ease-out;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
        }
        @keyframes cryptoPop {
            from { transform: scale(0.88); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .crypto-modal-close {
            position: absolute;
            top: 1rem; right: 1.2rem;
            font-size: 1.6rem;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            background: none;
            border: none;
            line-height: 1;
        }
        .crypto-modal-close:hover { color: #fff; transform: rotate(90deg); }
        .crypto-modal-name {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.25rem;
        }
        .crypto-modal-price {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 700;
            margin: 0.4rem 0 0.2rem;
        }
        .crypto-modal-change {
            text-align: center;
            font-size: 1rem;
            margin-bottom: 1.2rem;
            opacity: 0.85;
        }
        .crypto-modal-chart {
            height: 200px;
            margin-bottom: 1.4rem;
        }
        .crypto-modal-addr-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.45);
            margin-bottom: 0.4rem;
        }
        .crypto-modal-addr {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.7rem;
            padding: 0.8rem 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            color: rgba(255,255,255,0.85);
            margin-bottom: 0.8rem;
        }
        .crypto-modal-copy {
            display: block;
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 0.7rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: filter 0.2s, transform 0.2s;
            color: #fff;
        }
        .crypto-modal-copy:hover { filter: brightness(1.15); transform: translateY(-1px); }

        @media (max-width: 430px) {
            #profile-block {
                width: 95%;
            }
            .profile-container {
                width: 7.5rem;
                height: 7.5rem;
            }
            .location-label {
                font-size: 0.9rem;
                bottom: 0.1rem;
                right: 1rem;
            }
            #current-weather {
                font-size: 2.5rem;
            }
            .day-forecast {
                font-size: 1rem;
                padding: 0.5rem;
            }
        }
    </style>
</head>
