<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .coming-soon {
            font-size: 6em;
            text-align: center;
            text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffcc00;
            animation: pulse 4s infinite alternate;
            z-index: 2;
        }

        @keyframes pulse {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* Police Tape Top - Stripes only */
        .tape-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 80px;
            background: repeating-linear-gradient(
                45deg,
                #ffcc00,
                #ffcc00 40px,
                #000 40px,
                #000 80px
            );
            animation: moveLeft 30s linear infinite;
            z-index: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        /* Police Tape Bottom - Stripes only */
        .tape-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 80px;
            background: repeating-linear-gradient(
                45deg,
                #ffcc00,
                #ffcc00 40px,
                #000 40px,
                #000 80px
            );
            animation: moveRight 35s linear infinite;
            z-index: 1;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.8);
        }

        @keyframes moveLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes moveRight {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .coming-soon {
                font-size: 4em;
            }
            .tape-top, .tape-bottom {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="tape-top"></div>

    <h1 class="coming-soon">COMING SOON</h1>

    <div class="tape-bottom"></div>
</body>
</html>
