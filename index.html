<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    .tape-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      padding: 0 40px;
    }

    .tape {
      position: relative;
      background: repeating-linear-gradient(
        45deg,
        #ffeb3b,
        #ffeb3b 40px,
        #000 40px,
        #000 80px
      );
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transform: rotate(-6deg);
      animation: float 6s ease-in-out infinite;
    }

    .tape::before,
    .tape::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100px;
      background: inherit;
    }

    .tape::before { left: -90px; transform: skewX(-20deg); }
    .tape::after  { right: -90px; transform: skewX(20deg); }

    .text {
      color: #ffffff;                /* Pure white text */
      font-size: 70px;
      font-weight: 900;
      letter-spacing: 16px;
      text-transform: uppercase;
      white-space: nowrap;

      /* Strong black stroke so it's readable on yellow AND black stripes */
      -webkit-text-stroke: 7px #000000;
      text-stroke: 7px #000000;
      
      text-shadow: 
        0 0 30px #000,
        5px 5px 0 #000,
        -5px -5px 0 #000;
    }

    @keyframes float {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50% { transform: rotate(-6deg) translateY(-20px); }
    }

    .extra-tape {
      position: absolute;
      width: 120%;
      height: 100px;
      background: repeating-linear-gradient(
        135deg,
        #ffeb3b,
        #ffeb3b 40px,
        #000 40px,
        #000 80px
      );
      top: 50%;
      left: -10%;
      transform: translateY(-50%) rotate(8deg);
      opacity: 0.7;
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="tape-container">
    <div class="extra-tape"></div>
    <div class="tape">
      <div class="text">Coming Soon</div>
    </div>
  </div>

</body>
</html>
