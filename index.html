<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iayx Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* Black Screen with Click to Enter */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 1s ease-in-out;
            pointer-events: auto;
        }

        #intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        #intro-text {
            color: #fff;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease;
        }

        #intro-text:hover {
            transform: scale(1.05);
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 10%, transparent 20%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }

        body:not(.touch-device) {
            cursor: none;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Background Video */
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #background-video.visible {
            opacity: 0.5;
        }

        /* Profile Block */
        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) perspective(1000px);
            width: 820px;
            min-height: 332px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(20, 20, 20, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(15px);
            transition: opacity 1s ease-in-out, transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        #profile-block.visible {
            opacity: 1;
            visibility: visible;
        }

        #profile-block:hover {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .profile-container {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s ease;
        }

        .profile-picture:hover {
            transform: scale(1.05);
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #profile-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.4), 0 0 10px rgba(255, 255, 255, 0.2);
        }

        #profile-bio {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            line-height: 1.6;
            margin: 10px 0;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid #fff;
            width: fit-content;
        }

        #reseller-info {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #discord-user {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        #discord-button {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            font-weight: 600;
        }

        #discord-button:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            transform: translateY(-2px);
        }

        .bio-separator {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 20px 0;
        }

        .profile-footer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: auto;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            pointer-events: auto;
        }

        .social-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
            cursor: pointer;
            pointer-events: auto;
        }

        .social-button img {
            width: 24px;
            height: 24px;
            transition: transform 0.3s ease;
        }

        .social-button:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            border-color: rgba(255, 255, 255, 0.3);
        }

        .social-button:hover img {
            transform: rotate(10deg);
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 14px;
            z-index: 30;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Cursor Trail */
        .cursor-trail-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        /* Responsive Design */
        @media (max-width: 430px) {
            #intro-text {
                font-size: 32px;
                padding: 0 20px;
            }

            #profile-block {
                width: 90vw;
                max-width: 350px;
                min-height: 280px;
                padding: 20px;
            }

            .profile-header {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .profile-container {
                width: 120px;
                height: 120px;
            }

            .profile-picture {
                width: 120px;
                height: 120px;
            }

            .profile-info {
                align-items: center;
                text-align: center;
            }

            #profile-name {
                font-size: 24px;
                letter-spacing: 1px;
            }

            #profile-bio {
                font-size: 14px;
                line-height: 1.5;
            }

            #reseller-info {
                font-size: 14px;
                justify-content: center;
            }

            #discord-user {
                font-size: 12px;
            }

            .social-links {
                gap: 12px;
            }

            .social-button {
                width: 36px;
                height: 36px;
            }

            .social-button img {
                width: 20px;
                height: 20px;
            }

            .notification {
                font-size: 12px;
                padding: 10px 20px;
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Intro Screen -->
    <div id="intro-screen">
        <div id="intro-text">Click to Enter</div>
    </div>

    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>

    <!-- Background Video -->
    <video id="background-video" autoplay loop muted playsinline>
        <source src="background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Background Audio -->
    <audio id="background-audio" loop muted preload="auto">
        <source src="Audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Profile Block -->
    <div id="profile-block">
        <div class="profile-header">
            <div class="profile-container">
                <img src="ProfilePicture.jpg" alt="Profile" class="profile-picture">
            </div>
            <div class="profile-info">
                <div id="profile-name">Iayx</div>
                <div id="profile-bio"></div>
                <div id="reseller-info">
                    Reseller | 
                    <button id="discord-button" onclick="window.open('https://discord.gg/MxmB8jfRtZ', '_blank')">Check it out</button>
                </div>
                <div id="discord-user">Discord user: iayx</div>
            </div>
        </div>
        <div class="bio-separator"></div>
        <div class="profile-footer">
            <div class="social-links">
                <button onclick="copyToClipboard('bc1q7urjtd2naxmajcvylmmz5clqyc3mfmvauw9kmt', 'Bitcoin')" class="social-button">
                    <img src="bitcoin (1).png" alt="Bitcoin">
                </button>
                <button onclick="copyToClipboard('Lb5718yTJaK1wPkMd33USucPyN13kMtrGY', 'Litecoin')" class="social-button">
                    <img src="litecoin (1).png" alt="Litecoin">
                </button>
                <button onclick="copyToClipboard('0xdaB1b433BD3AeB1ADbAA5724B9cC05EAf047be46', 'Ethereum')" class="social-button">
                    <img src="ethereum (3).png" alt="Ethereum">
                </button>
                <button onclick="copyToClipboard('9QNvBo7uwd3AfwxM7Dfc3Ufm4ML6TG2gtHH7GSnNjnih', 'Solana')" class="social-button">
                    <img src="solana.png" alt="Solana">
                </button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script>
        // Handle Intro Screen and Audio
        const introScreen = document.getElementById('intro-screen');
        const profileBlock = document.getElementById('profile-block');
        const backgroundVideo = document.getElementById('background-video');
        const audio = document.getElementById('background-audio');
        const notification = document.getElementById('notification');

        document.addEventListener('click', () => {
            console.log('Click detected, hiding intro screen and starting audio');
            introScreen.classList.add('hidden');
            profileBlock.classList.add('visible');
            backgroundVideo.classList.add('visible');
            audio.muted = false;
            audio.play().then(() => {
                console.log('Audio playback started successfully');
            }).catch((error) => {
                console.error('Audio playback failed:', error);
                notification.textContent = 'Click again to enable audio';
                notification.classList.add('show');
                setTimeout(() => {
                    if (notification.textContent === 'Click again to enable audio') {
                        notification.classList.remove('show');
                    }
                }, 3000);
            });
        }, { once: true });

        // Typewriter Effect
        const bioElement = document.getElementById('profile-bio');
        const phrases = ['locked in', 'I love gambling', 'passion project'];
        let currentPhrase = 0;
        let isDeleting = false;
        let text = '';
        let i = 0;

        function type() {
            const fullText = phrases[currentPhrase];
            if (isDeleting) {
                text = fullText.substring(0, i--);
            } else {
                text = fullText.substring(0, i++);
            }

            bioElement.textContent = text;

            if (!isDeleting && i > fullText.length) {
                isDeleting = true;
                setTimeout(type, 1000);
            } else if (isDeleting && i < 0) {
                isDeleting = false;
                currentPhrase = (currentPhrase + 1) % phrases.length;
                setTimeout(type, 500);
            } else {
                const speed = isDeleting ? 50 : 100;
                setTimeout(type, speed);
            }
        }

        type();

        // Profile Block Tilt Effect
        profileBlock.addEventListener('mousemove', (e) => {
            if (profileBlock.classList.contains('visible')) {
                const rect = profileBlock.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                const tiltX = (y / rect.height) * 15;
                const tiltY = -(x / rect.width) * 15;
                profileBlock.style.transform = `translate(-50%, -50%) perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
            }
        });

        profileBlock.addEventListener('mouseleave', () => {
            if (profileBlock.classList.contains('visible')) {
                profileBlock.style.transform = `translate(-50%, -50%) perspective(1000px)`;
            }
        });

        // Custom Cursor
        const cursor = document.querySelector('.custom-cursor');
        const trailDots = [];
        const maxDots = 10;

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            const dot = document.createElement('div');
            dot.className = 'cursor-trail-dot';
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            document.body.appendChild(dot);
            trailDots.push(dot);

            if (trailDots.length > maxDots) {
                const oldDot = trailDots.shift();
                oldDot.style.opacity = '0';
                setTimeout(() => oldDot.remove(), 300);
            }
        });

        // Copy to Clipboard with Notification
        function copyToClipboard(value, type) {
            navigator.clipboard.writeText(value).then(() => {
                notification.textContent = `Copied ${type} address`;
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }).catch((err) => {
                console.error('Failed to copy: ', err);
                notification.textContent = 'Failed to copy address';
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            });
        }
    </script>
</body>
</html>
